<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Powell-Roach Lab logo</title>
  <!-- Concept: a blood drop whose tip bends over like a sickle, holding a healthy red blood cell
       (plus a small sickled cell and a tiny healthy cell), with a pain signal that turns white
       as it passes through the blood. -->
  <defs>
    <path id="drop" d="M88,5 C70,16 23,45 23,79 C23,100 40,115 61,115 C82,115 98,100 98,79 C98,59 87,47 78,38 C70,30 72,15 88,5 Z"/>
    <linearGradient id="dropFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a6a"/>
      <stop offset=".45" stop-color="#d80d3b"/>
      <stop offset="1" stop-color="#7d0020"/>
    </linearGradient>
    <radialGradient id="light" cx=".32" cy=".38" r=".62">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="under" cx=".62" cy="1.02" r=".55">
      <stop offset="0" stop-color="#4a0012" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4a0012" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9e1"/>
    </linearGradient>
    <radialGradient id="pallor" cx=".42" cy=".4" r=".62">
      <stop offset="0" stop-color="#ffc2cf"/>
      <stop offset=".7" stop-color="#f5859d"/>
      <stop offset="1" stop-color="#e2597a"/>
    </radialGradient>
    <clipPath id="inDrop"><use href="#drop"/></clipPath>
    <filter id="cellShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0.6" dy="1.6" stdDeviation="1.4" flood-color="#4a0012" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- drop body with lighting -->
  <use href="#drop" fill="url(#dropFill)"/>
  <g clip-path="url(#inDrop)">
    <rect width="120" height="120" fill="url(#light)"/>
    <rect width="120" height="120" fill="url(#under)"/>
    <!-- thin inner rim light -->
    <use href="#drop" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="2.2"/>
    <!-- small sickled cell drifting in the blood -->
    <path d="M75,86 A10.2,10.2 0 0,1 95,86 A14,14 0 0,0 75,86 Z" transform="rotate(-22 85 82) translate(0 -2)" fill="#fff" fill-opacity=".8"/>
    <!-- tiny healthy cell -->
    <circle cx="40" cy="108.6" r="3.4" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1.8"/>
  </g>
  <!-- crescent-shaped gloss: light on the drop and a sickled cell -->
  <path d="M47,44 C31,53 24,70 29,89 C35,74 39,59 47,44 Z" fill="#fff" fill-opacity=".55"/>

  <!-- healthy red blood cell: shaded biconcave ring -->
  <g filter="url(#cellShadow)">
    <circle cx="61" cy="65" r="13.5" fill="none" stroke="url(#ring)" stroke-width="7"/>
  </g>
  <circle cx="61" cy="65" r="10" fill="url(#pallor)" fill-opacity=".9"/>
  <circle cx="61" cy="65" r="10" fill="none" stroke="#8a0024" stroke-opacity=".22" stroke-width="1"/>
  <path d="M51.5,58.5 A12,12 0 0 1 60,52.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".9"/>

  <!-- pain signal: scarlet outside, white inside the drop (with a soft depth line) -->
  <path d="M3 99 H38 L44 91 L51 109 L58 87 L64 99 H117" fill="none" stroke="#cc0033" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g clip-path="url(#inDrop)">
    <path d="M3 100.6 H38 L44 92.6 L51 110.6 L58 88.6 L64 100.6 H117" fill="none" stroke="#4a0012" stroke-opacity=".35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 99 H38 L44 91 L51 109 L58 87 L64 99 H117" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
